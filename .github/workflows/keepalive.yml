# Keep the free services awake (Increment 2 design, Section 10). The Space sleeps after 48 hours without a visit and
# the free database pauses after a week without use; a deep health check every 6 hours touches both. Until the
# API_URL variable exists, it only notes that there is nothing to call (docs/Deployment.md).
name: Keep alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the API health check
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::API_URL is not set, so there is nothing to call (docs/Deployment.md)."
            exit 0
          fi
          # A sleeping Space takes a few minutes to start, so retry for up to about 6 minutes.
          curl --fail --silent --show-error --retry 12 --retry-delay 30 --retry-all-errors --max-time 60 \
            "${API_URL%/}/api/v1/health?deep=true"
