# Continuous integration (Increment 1 design, Section 9): lint and tests for the API, type checks, tests, and
# build for the web app. Runs on every pull request and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internsync
          POSTGRES_PASSWORD: internsync
          POSTGRES_DB: internsync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U internsync" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://internsync:internsync@localhost:5432/internsync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: pytest -p no:logging --cov=app --cov-report=term --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
