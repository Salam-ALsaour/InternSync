# Continuous integration (Increment 1 design, Section 9): lint, tests, and the API contract check for the API;
# type checks, tests, and build for the web app. Runs on every pull request and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: internsync
          POSTGRES_PASSWORD: internsync
          POSTGRES_DB: internsync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U internsync" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://internsync:internsync@localhost:5432/internsync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Dependency audit (NFR-SEC-05; any known vulnerability fails, pip-audit has no severity filter)
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt --progress-spinner off
      - run: ruff check app tests alembic scripts
      - run: pytest -p no:logging --cov=app --cov-report=term --cov-fail-under=70
      - name: OpenAPI document matches the committed copy
        run: python scripts/export_openapi.py ../frontend/src/api/openapi.json && git diff --exit-code ../frontend/src/api/openapi.json
      - name: Requirements status up to date and document links valid (Increment 5)
        run: python ../docs/tools/trace.py --check && python ../docs/tools/check_links.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit of what ships to users (NFR-SEC-05)
        run: npm audit --omit=dev --audit-level=critical
      - name: API types match the OpenAPI document
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  # Browser tests (NFR-PRT-01, NFR-USA-03, NFR-USA-04; Increment 4, RQ-7) against the Docker stack with the demo
  # data, on pull requests only, to keep within the free Actions minutes.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p internsync -f docker-compose.yml -f docker-compose.check.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack on its own database, with the demo data
        run: |
          $COMPOSE up -d --wait db mailpit
          $COMPOSE exec -T db psql -U internsync -d postgres -c "CREATE DATABASE internsync_check"
          $COMPOSE up -d --build api web
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/v1/health && break; sleep 5; done
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5173/login && break; sleep 5; done
          $COMPOSE exec -T api python -m app.seed --demo
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
