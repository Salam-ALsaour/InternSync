# Permission matrix (Increment 1 design, Section 11; AT-AUT-05).
# Every route with the callers allowed past the role gates. public = no sign-in; unverified = a signed-in
# student whose verification is pending; ca = a Company Admin (also allowed wherever cs is).
# Record scope (other college, other company, other student) is tested in the module suites.

